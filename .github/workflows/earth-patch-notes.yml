name: 지구 패치노트 자동 업로드

on:
  schedule:
    - cron: "7 9 * * *"   # 매일 18:07 (KST). 저장소 변수 PATCHNOTES_AUTO=true 일 때만 실행
  workflow_dispatch:
    inputs:
      topic:
        description: '주제 (비우면 topics.txt 다음 주제). 예: 중력이 10,000배가 되었습니다'
        required: false
      privacy:
        description: 공개 설정
        type: choice
        options: [private, unlisted, public]
        default: private

permissions:
  contents: write

concurrency: earth-patch-notes

jobs:
  make-and-upload:
    if: github.event_name == 'workflow_dispatch' || vars.PATCHNOTES_AUTO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: earth-patch-notes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: earth-patch-notes/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: YouTube 토큰 준비
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: printf '%s' "$YT_TOKEN_JSON" > youtube_token.json

      - name: 영상 제작 + 업로드
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_SECRET: ${{ secrets.HF_API_SECRET }}
          TOPIC: ${{ inputs.topic }}
          PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY || 'private' }}
        run: |
          args=(run --privacy "$PRIVACY")
          if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
          python -m patchnotes "${args[@]}"

      - name: 영상 파일 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-patch-notes-${{ github.run_number }}
          path: earth-patch-notes/output/**/final.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: 이력(버전 번호) 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "지구 패치노트: 이력 갱신" && git push)
